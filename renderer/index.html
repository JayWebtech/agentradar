<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'" />
  <title>Agent Radar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="frame" id="frame">
    <main class="island" id="widget" data-mood="idle">
      <header class="head">
        <div class="orb" aria-hidden="true">
          <span class="orb-sweep"></span>
          <span class="orb-ring"></span>
          <span class="orb-core"></span>
        </div>
        <div class="head-text" id="headText">
          <div class="headline" id="headline">Agent Radar</div>
          <div class="sub" id="sub">Listening</div>
        </div>
        <div class="head-actions">
          <button class="icon" id="collapse" title="Collapse" aria-label="Collapse or expand">
            <svg viewBox="0 0 16 16"><path d="M4.5 9.75 8 6.25l3.5 3.5" /></svg>
          </button>
          <button class="icon" id="menu" title="Options" aria-label="Options">
            <svg viewBox="0 0 16 16"><circle cx="3.75" cy="8" r="1.15" /><circle cx="8" cy="8" r="1.15" /><circle cx="12.25" cy="8" r="1.15" /></svg>
          </button>
        </div>
      </header>
      <div class="list-wrap" id="listWrap">
        <section class="list" id="list"></section>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
