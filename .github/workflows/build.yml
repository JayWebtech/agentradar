name: Build & Release

# Every push / PR builds the app for macOS, Windows and Linux and attaches the installers to the run.
# Pushing a version tag (v0.2.0) also publishes them to a draft GitHub Release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to create the release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, flag: --mac }
          - { name: Windows, os: windows-latest, flag: --win }
          - { name: Linux, os: ubuntu-latest, flag: --linux }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version v$v"; exit 1
          fi

      - name: Build installers
        shell: bash
        run: |
          # Signing is optional. GitHub passes unset secrets as empty strings, and electron-builder
          # treats an empty CSC_LINK as a (bad) file path, so only export what is actually set.
          set_if() { if [ -n "$2" ]; then export "$1=$2"; fi; }
          set_if CSC_LINK "$MAC_CERT"
          set_if CSC_KEY_PASSWORD "$MAC_CERT_PASSWORD"
          set_if APPLE_ID "$APPLE_ID_SECRET"
          set_if APPLE_APP_SPECIFIC_PASSWORD "$APPLE_PASSWORD_SECRET"
          set_if APPLE_TEAM_ID "$APPLE_TEAM_SECRET"
          set_if WIN_CSC_LINK "$WIN_CERT"
          set_if WIN_CSC_KEY_PASSWORD "$WIN_CERT_PASSWORD"
          if [ -z "$MAC_CERT" ] && [ -z "$WIN_CERT" ]; then
            echo "No signing certificates configured — building unsigned apps."
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder ${{ matrix.flag }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional signing + notarization secrets (see README → Code signing)
          MAC_CERT: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID_SECRET: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_SECRET: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_SECRET: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CERT: ${{ secrets.WIN_CERTIFICATE_PFX_BASE64 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: Agent-Radar-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
